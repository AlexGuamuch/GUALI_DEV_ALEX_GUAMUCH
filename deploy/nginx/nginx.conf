# Nginx: proxy inverso con seguridad integrada.
# Sirve el frontend estático y envía /api/** al gateway. Detrás de Cloudflare (WAF, DDoS, CDN, TLS).

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    client_max_body_size 11m;

    # Tiempos con el gateway (las rutas de compilar e importar los amplían).
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # IP real del visitante cuando el tráfico llega a través de Cloudflare.
    include /etc/nginx/guali/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;

    # Límites por IP (además de Cloudflare y del gateway).
    limit_req_zone  $binary_remote_addr zone=api:10m    rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=codigo:10m rate=40r/m;
    limit_req_zone  $binary_remote_addr zone=login:10m  rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conexiones:10m;
    limit_req_status  429;
    limit_conn_status 429;

    log_format principal '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                         '"$http_user_agent" rt=$request_time';
    access_log /dev/stdout principal;
    error_log  /dev/stderr warn;

    upstream gateway {
        server gateway:8080;
        keepalive 16;
    }

    # HTTP: pruebas locales y verificación de salud. En producción solo escucha en 127.0.0.1.
    server {
        listen 8080;
        server_name _;
        include /etc/nginx/guali/sitio.conf;
    }

    # HTTPS de producción (certificado de origen de Cloudflare). Solo existe si se monta deploy/nginx/tls.
    include /etc/nginx/tls/*.conf;
}
