# Servidor HTTPS de producción. Cloudflare se conecta aquí en modo "Full (strict)".
# Certificado y llave: Cloudflare → SSL/TLS → Origin Server → Create Certificate.
# Guardarlos como deploy/nginx/tls/origen.pem y deploy/nginx/tls/origen.key (no se suben a git).
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/origen.pem;
    ssl_certificate_key /etc/nginx/tls/origen.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;

    # Authenticated Origin Pulls: solo Cloudflare puede conectarse al origen (mTLS).
    # Activar en Cloudflare → SSL/TLS → Origin Server y descargar el certificado de Cloudflare como
    # deploy/nginx/tls/cloudflare-origin-pull-ca.pem
    ssl_client_certificate /etc/nginx/tls/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    include /etc/nginx/guali/sitio.conf;
}
