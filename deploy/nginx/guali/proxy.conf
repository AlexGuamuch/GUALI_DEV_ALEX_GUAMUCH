# Reenvío al gateway. X-Real-IP se reemplaza siempre (el cliente no puede falsificarlo).
proxy_pass http://gateway;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header X-Cliente-Id "";
proxy_set_header X-Interno-Token "";
proxy_set_header X-Gateway-Token "";
proxy_hide_header X-Powered-By;
# El gateway también envía cabeceras de seguridad (para cuando corre sin nginx): aquí se usan las de nginx.
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
include /etc/nginx/guali/cabeceras-seguridad.conf;
