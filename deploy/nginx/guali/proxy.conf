# Reenvío al gateway. X-Real-IP se reemplaza siempre (el cliente no puede falsificarlo).
proxy_pass http://gateway;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header X-Cliente-Id "";
proxy_set_header X-Interno-Token "";
proxy_set_header X-Gateway-Token "";
proxy_hide_header X-Powered-By;
include /etc/nginx/guali/cabeceras-seguridad.conf;
