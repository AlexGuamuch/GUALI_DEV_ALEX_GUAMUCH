# Reglas del sitio, compartidas por el servidor HTTP (local) y el HTTPS (producción).
root /usr/share/nginx/html;
index index.html;
charset utf-8;

limit_conn conexiones 40;

include /etc/nginx/guali/cabeceras-seguridad.conf;

# Archivos internos que nunca deben servirse.
location ~ /\. { return 404; }
location ^~ /interno/  { return 404; }
location ^~ /actuator/ { return 404; }

location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/guali/cabeceras-seguridad.conf;
}

location ^~ /assets/fonts/ {
    expires 30d;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/guali/cabeceras-seguridad.conf;
}

location ^~ /assets/vendor/ {
    expires 30d;
    add_header Cache-Control "public" always;
    include /etc/nginx/guali/cabeceras-seguridad.conf;
}

location /api/ {
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/guali/proxy.conf;
}

location /api/codigo/ {
    limit_req zone=codigo burst=10 nodelay;
    proxy_read_timeout 60s;
    include /etc/nginx/guali/proxy.conf;
}

location = /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    include /etc/nginx/guali/proxy.conf;
}

location = /api/admin/lecciones/importar {
    limit_req zone=login burst=5 nodelay;
    proxy_request_buffering on;
    proxy_read_timeout 120s;
    include /etc/nginx/guali/proxy.conf;
}

error_page 404 /404.html;
