# ==========================================================================
#  Codifica con Guali — configuración para ejecutar el proyecto en una PC
#
#  Solo hay que revisar la conexión a MariaDB. Las bases de datos
#  (guali_lecciones y guali_admin) y sus tablas se crean solas al arrancar.
#
#  Si prefieres no modificar este archivo, crea configuracion.local.properties
#  en esta misma carpeta con los valores que cambian: tiene prioridad.
# ==========================================================================

# --- MariaDB instalado en esta computadora ---
db.servidor=localhost
db.puerto=3306
db.usuario=root
db.clave=root

# --- Administrador que se crea la primera vez (si todavía no existe ninguno) ---
# Inicia sesión en http://localhost:8080/login.html y cambia la contraseña desde el panel.
admin.usuario=admin
admin.nombre=Administrador
admin.clave=GualiDev2026!
