server:
  port: 8081
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: lecciones-service
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/guali_lecciones}
    username: ${DB_USUARIO:guali_lecciones}
    password: ${DB_CLAVE:}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

guali:
  seguridad:
    clave-publica: ${JWT_CLAVE_PUBLICA:file:../../deploy/secrets/jwt-publica.pem}
    cookie-segura: ${COOKIE_SEGURA:false}
    token-interno: ${TOKEN_INTERNO:}
    token-gateway: ${TOKEN_GATEWAY:}
  lecciones:
    semilla: ${LECCIONES_SEMILLA:true}
  compilador:
    url: ${COMPILADOR_URL:http://localhost:8083}
    # Token distinto al interno: el compilador ejecuta código ajeno y no debe conocer otros secretos.
    token: ${TOKEN_COMPILADOR:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
